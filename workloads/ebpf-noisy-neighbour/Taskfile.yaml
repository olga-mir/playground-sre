version: '3'

vars:
  SERVICE_NAME: experiment-ebpf
  LIMA_INSTANCE_NAME: ebpf-dev
  REGISTRY_REPO: "{{.SERVICE_NAME}}"

  # Default output dir for debug snapshots: $SRE_REPO_STASH if set, else
  # <repo root>/stash (gitignored). Task runs from this directory, so a bare
  # relative path would land inside the workload folder.
  STASH_DIR:
    sh: echo "${SRE_REPO_STASH:-$(git rev-parse --show-toplevel)/stash}"

  PROJECT_ID:
    sh: echo "${PROJECT_ID:?'PROJECT_ID environment variable is required'}"
  REGION:
    sh: echo "${REGION:?'REGION environment variable is required'}"

  # Name provision-cluster creates. Live tasks use CLUSTER_NAME_LIVE.
  CLUSTER_NAME: "{{.SERVICE_NAME}}-cluster"

  # GKE cluster location — a zone (e.g. australia-southeast1-a) for a zonal
  # cluster. Auto-detected from the live cluster via gcloud (by name first,
  # then by taking the first cluster in the project as a fallback for clusters
  # provisioned with a different name). Falls back to CLUSTER_LOCATION env or
  # REGION only when no cluster exists yet. Override by exporting CLUSTER_LOCATION.
  CLUSTER_LOCATION:
    sh: >
      if [ -n "${CLUSTER_LOCATION:-}" ]; then echo "$CLUSTER_LOCATION"; exit 0; fi;
      loc=$(gcloud container clusters list
      --project '{{.PROJECT_ID}}' --filter 'name={{.CLUSTER_NAME}}'
      --format 'value(location)' 2>/dev/null | head -1);
      if [ -z "$loc" ]; then
        loc=$(gcloud container clusters list
        --project '{{.PROJECT_ID}}'
        --format 'value(location)' 2>/dev/null | head -1);
      fi;
      echo "${loc:-{{.REGION}}}"

  # Name of the cluster that exists in PROJECT_ID. The canonical name wins
  # when it exists; otherwise the only cluster in the project. Do not
  # short-circuit on $CLUSTER_NAME: Task exports that var into this shell, so
  # the check always succeeded and an export (for example ebfp-experiment)
  # made delete target a cluster that does not exist.
  CLUSTER_NAME_LIVE:
    sh: >
      name=$(gcloud container clusters list
      --project '{{.PROJECT_ID}}' --filter 'name={{.CLUSTER_NAME}}'
      --format 'value(name)' --limit=1 2>/dev/null | head -1);
      if [ -n "$name" ]; then echo "$name"; exit 0; fi;
      names=$(gcloud container clusters list
      --project '{{.PROJECT_ID}}'
      --format 'value(name)' --limit=2 2>/dev/null);
      count=$(printf '%s\n' "$names" | grep -c . || true);
      if [ "$count" -eq 1 ]; then printf '%s\n' "$names"; exit 0; fi;
      echo "{{.CLUSTER_NAME}}"

  # Every kubectl call is pinned to an explicit context so tasks never act on
  # whatever `kubectl config current-context` happens to be. Defaults to the
  # current kubectl context; override by exporting KUBE_CONTEXT.
  KUBE_CONTEXT:
    sh: echo "${KUBE_CONTEXT:-$(kubectl config current-context)}"

  GIT_COMMIT:
    sh: git rev-parse --short HEAD

  ARTIFACT_REGISTRY: "{{.REGION}}-docker.pkg.dev"
  IMAGE_PATH: "{{.ARTIFACT_REGISTRY}}/{{.PROJECT_ID}}/{{.REGISTRY_REPO}}/{{.SERVICE_NAME}}"

tasks:
  preflight:
    desc: Validate required environment variables and print resolved values
    cmds:
      - echo "PROJECT_ID={{.PROJECT_ID}}"
      - echo "REGION={{.REGION}}"
      - echo "CLUSTER_NAME (canonical)={{.CLUSTER_NAME}}"
      - echo "CLUSTER_NAME_LIVE (resolved)={{.CLUSTER_NAME_LIVE}}"
      - echo "CLUSTER_LOCATION={{.CLUSTER_LOCATION}}"
      - echo "KUBE_CONTEXT={{.KUBE_CONTEXT}}"
      - echo "IMAGE_PATH={{.IMAGE_PATH}}"
      - 'kubectl config get-contexts {{.KUBE_CONTEXT}} >/dev/null 2>&1 || echo "WARN: kube context {{.KUBE_CONTEXT}} not found — run: task ebpf:get-credentials"'

  get-credentials:
    desc: Fetch kubeconfig credentials for the cluster (writes the kubectl context)
    cmds:
      - gcloud container clusters get-credentials {{.CLUSTER_NAME_LIVE}} --zone={{.CLUSTER_LOCATION}} --project={{.PROJECT_ID}}

  provision-cluster:
    desc: >
      Provision a standalone GKE cluster with a tainted noisy-node pool for
      manual testing (gcloud, no GitOps/Flux involved). CLUSTER_LOCATION must
      be exported as a zone (e.g. australia-southeast1-a) — on first
      provisioning there's no live cluster yet for it to auto-detect from, so
      it would otherwise fall back to the REGION var, which --zone rejects.
    cmds:
      - PROJECT_ID={{.PROJECT_ID}} CLUSTER_LOCATION={{.CLUSTER_LOCATION}} CLUSTER_NAME={{.CLUSTER_NAME}} ./scripts/provision-stand-alone-cluster.sh

  delete-cluster:
    desc: Delete the standalone GKE cluster
    cmds:
      - gcloud container clusters delete {{.CLUSTER_NAME_LIVE}} --location={{.CLUSTER_LOCATION}} --project={{.PROJECT_ID}} --quiet


  lima-start:
    desc: Start lima instance
    cmds:
      - limactl start --name {{.LIMA_INSTANCE_NAME}} {{.TASKFILE_DIR}}/lima-ebpf.yaml --tty=false

  lima-cleanup:
    desc: Stop and remove lima instance
    cmds:
      - limactl stop {{.LIMA_INSTANCE_NAME}} || true
      - limactl delete {{.LIMA_INSTANCE_NAME}} || true

  docker-auth:
    desc: Configure Docker auth for Artifact Registry (run on local before lima-build-image inside Lima)
    # Easier to do from local — gcloud not reliably available inside lima
    cmds:
      - limactl shell {{.LIMA_INSTANCE_NAME}} docker login -u oauth2accesstoken --password-stdin {{.ARTIFACT_REGISTRY}} <<< $(gcloud auth print-access-token)

  local-build-image:
    desc: Build and push image locally (cross-compile linux/amd64)
    vars:
      FULL_IMAGE_TAG: '{{.IMAGE_PATH}}:{{.GIT_COMMIT}}'
    cmds:
      - >
        docker buildx build -f Dockerfile
        -t {{.FULL_IMAGE_TAG}}
        -t {{.IMAGE_PATH}}:latest
        --platform linux/amd64
        --push .

  lima-build-image:
    desc: Build and push image inside Lima instance (run `task docker-auth` on local first)
    vars:
      FULL_IMAGE_TAG: '{{.IMAGE_PATH}}:{{.GIT_COMMIT}}'
    cmds:
      - >
        docker buildx build -f Dockerfile
        -t {{.FULL_IMAGE_TAG}}
        -t {{.IMAGE_PATH}}:latest
        --platform linux/amd64
        --push .

  build-ebpf:
    desc: Compile only the eBPF C source with clang (run inside Lima)
    cmds:
      - clang -O2 -g -target bpf -D__TARGET_ARCH_x86 -I./bpf -I/usr/include/x86_64-linux-gnu -I/usr/include/bpf -c ./bpf/noisy-neighbour.bpf.c -o ./bpf/noisy-neighbour.bpf.o

  ensure-namespace:
    desc: Create the ebpf-noisy-neighbour namespace if it does not already exist
    internal: true
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/namespace.yaml

  ensure-test-namespace:
    desc: Create the noisy-test namespace if it does not already exist
    internal: true
    aliases: [ensure-noisy-test-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/namespace-noisy-test.yaml

  deploy-stack:
    desc: >
      Deploy the full eBPF experiment stack: daemonset, monitoring, ballast,
      victim, and bully workloads. Uses the image built by local-build-image.
      DIR defaults to $SRE_REPO_STASH if set, else <repo root>/stash.
    cmds:
      - task: deploy-k8s
      - task: deploy-node-exporter
      - task: deploy-monitoring
      - task: deploy-ballast
      - task: deploy-victim
      - task: deploy-bpftool

  deploy-k8s:
    desc: >
      Deploy the eBPF daemonset to a standalone manually-provisioned cluster
      (uses the image built by local-build-image/lima-build-image, not the
      Flux-pinned GitOps image). Creates the namespace if missing.
    internal: true
    vars:
      FULL_IMAGE_TAG: '{{.IMAGE_PATH}}:latest'
    deps: [ensure-namespace]
    cmds:
      - >
        IMAGE={{.FULL_IMAGE_TAG}} envsubst < k8s/daemonset-manual.yaml | kubectl --context {{.KUBE_CONTEXT}} apply -f -

  deploy-monitoring:
    desc: Deploy GMP scrapes for the eBPF pods and kubelet PSI counters
    internal: true
    deps: [ensure-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/pod-monitoring.yaml
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/psi-collector.yaml

  deploy-node-exporter:
    internal: true
    desc: Deploy node-exporter DaemonSet + PodMonitoring to scrape node_cpu_seconds_total{mode="steal"} on the noisy-node pool
    deps: [ensure-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/node-exporter.yaml

  deploy-ballast:
    desc: Deploy ballast DaemonSet — pins 1 exclusive core per test node (needs static CPU Manager)
    internal: true
    deps: [ensure-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/ballast.yaml

  deploy-bpftool:
    aliases: [debug:deploy-bpftool, debug:deploy_bpftool]
    desc: Deploy the bpftool DaemonSet used by dump_runqueue and debug:bpftool (privileged, noisy-node pool)
    deps: [ensure-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/bpftool-daemonset.yaml

  debug:dump_runqueue:
    aliases: [debug:dump-runqueue, debug:dump-runq-enqueued, dump-runq-enqueued, dump_runqueue]
    desc: Dump runq_enqueued + runq_histograms BPF maps from the bpftool pod on the test node (manual leak check)
    cmds:
      - KUBE_CONTEXT={{.KUBE_CONTEXT}} ./scripts/dump-runq-enqueued.sh

  debug:list_cpus:
    aliases: [debug:list-cpus, debug:list-cpu-pinning, list-cpu-pinning, list_cpus]
    desc: >
      List containers on the noisy-node pool by the CPU the kubelet pinned them
      to. Prints the result and saves it to
      DIR/<YYYY.MM.DD-HH.MM.SS>-list-cpu-pinning.txt. DIR defaults to
      $SRE_REPO_STASH, else <repo root>/stash (created if missing).
    cmds:
      - |
        dir="{{default .STASH_DIR .DIR}}"
        mkdir -p "$dir"
        out="$dir/$(date +%Y.%m.%d-%H.%M.%S)-list-cpu-pinning.txt"
        KUBE_CONTEXT={{.KUBE_CONTEXT}} ./scripts/list-cpu-pinning.sh > "$out"
        cat "$out"
        echo "Saved to $out"

  debug:list_cgroups_labels:
    aliases: [debug:cgroups, debug:list_cgroups, debug:list-cgroups, debug:list-pod-cgroups, list-pod-cgroups, list_cgroups_labels]
    desc: >
      List containers on the noisy-node pool by their eBPF cgroup label.
      Prints the result and saves it to
      DIR/<YYYY.MM.DD-HH.MM.SS>-list-cgroup-labels.txt. DIR defaults to
      $SRE_REPO_STASH, else <repo root>/stash (created if missing).
    cmds:
      - |
        dir="{{default .STASH_DIR .DIR}}"
        mkdir -p "$dir"
        out="$dir/$(date +%Y.%m.%d-%H.%M.%S)-list-cgroup-labels.txt"
        KUBE_CONTEXT={{.KUBE_CONTEXT}} ./scripts/list-cgroup-labels.sh > "$out"
        cat "$out"
        echo "Saved to $out"

  debug:bpftool:
    aliases: [debug:bpftool-shell, debug:bpftool_shell]
    desc: Open an interactive shell inside the bpftool debug pod on the test node
    cmds:
      - |
        node="$(kubectl --context {{.KUBE_CONTEXT}} get nodes -l workload=noisy-node -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -n1)"
        if [ -z "$node" ]; then echo "No node matches selector workload=noisy-node" >&2; exit 1; fi
        pod="$(kubectl --context {{.KUBE_CONTEXT}} -n ebpf-noisy-neighbour get pods -l name=bpftool --field-selector "spec.nodeName=${node}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -n1)"
        if [ -z "$pod" ]; then echo "No bpftool pod found on ${node}. Deploy with: task ebpf:deploy-bpftool" >&2; exit 1; fi
        kubectl --context {{.KUBE_CONTEXT}} -n ebpf-noisy-neighbour exec -it "${pod}" -- /bin/sh

  deploy-victim:
    desc: >
      Deploy victim-api test workload to noisy-node pool.
      DIR defaults to $SRE_REPO_STASH if set, else <repo root>/stash.
    deps: [ensure-test-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/victim-api.yaml
      - kubectl --context {{.KUBE_CONTEXT}} -n noisy-test rollout status deploy/victim-api --timeout=180s
      - task: debug:list_cgroups_labels

  deploy-victim-load:
    desc: >
      Keep victim-api busy with flat-out fortio load from the default node pool.
      DIR defaults to $SRE_REPO_STASH if set, else <repo root>/stash.
    deps: [deploy-victim, ensure-test-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/victim-load.yaml
      - kubectl --context {{.KUBE_CONTEXT}} -n noisy-test rollout status deploy/victim-load --timeout=180s
      - task: debug:list_cgroups_labels

  deploy-bully:
    desc: >
      Deploy bully-hog CPU stressor to noisy-node pool.
      DIR defaults to $SRE_REPO_STASH if set, else <repo root>/stash.
    deps: [ensure-test-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/bully-hog.yaml
      - kubectl --context {{.KUBE_CONTEXT}} -n noisy-test rollout status deploy/bully-hog --timeout=180s
      - task: debug:list_cgroups_labels

  deploy-bully-io:
    desc: >
      Track B: deploy bully-io disk-I/O stressor to noisy-node pool (run alone, not with bully-net).
      DIR defaults to $SRE_REPO_STASH if set, else <repo root>/stash.
    deps: [ensure-test-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/bully-io.yaml
      - kubectl --context {{.KUBE_CONTEXT}} -n noisy-test rollout status deploy/bully-io --timeout=180s
      - task: debug:list_cgroups_labels

  deploy-bully-net:
    desc: >
      Track B: deploy bully-net network-I/O stressor to noisy-node pool (run alone, not with bully-io).
      DIR defaults to $SRE_REPO_STASH if set, else <repo root>/stash.
    deps: [ensure-test-namespace]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} apply -f k8s/bully-net.yaml
      - kubectl --context {{.KUBE_CONTEXT}} -n noisy-test rollout status deploy/bully-net --timeout=180s
      - task: debug:list_cgroups_labels

  delete-test-workloads:
    aliases: [delete-test-namespace]
    desc: Delete the noisy-test namespace and all test workloads inside it
    cmds:
      - kubectl --context {{.KUBE_CONTEXT}} delete namespace noisy-test --ignore-not-found

  help:
    desc: Show list of available tasks and their descriptions
    cmds:
      - task --list

