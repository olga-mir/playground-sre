apiVersion: apps/v1
kind: Deployment
metadata:
  name: bully-hog
  namespace: noisy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bully-hog
  template:
    metadata:
      labels:
        app: bully-hog
    spec:
      nodeSelector:
        workload: noisy-node
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "noisy-node"
        effect: "NoSchedule"
      containers:
      - name: stress
        image: alexeiled/stress-ng:latest
        args:
        - "--cpu"
        - "1"
        - "--cpu-load"
        - "50"                 # duty-cycle each worker to ~50% of a core: a hog that sleeps/wakes, not a 100% wall.
                               # Tune 30-70 to dial contention without touching requests or adding a (throttling) limit.
        - "--cpu-method"
        - "matrixprod"
        resources:
          requests:
            cpu: "85m"         # Minimum request to get scheduled easily
          # DO NOT SET CPU LIMITS: allows it to consume all unallocated core time
          # (Burstable QoS -> stays in the shared pool, never gets an exclusive core)
