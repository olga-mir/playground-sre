apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ebpf-noisy-neighbour
resources:
  - namespace.yaml
  - daemonset.yaml
  - pod-monitoring.yaml
  - node-exporter.yaml
  - bpftool-daemonset.yaml
  - ballast.yaml
  # psi-collector.yaml is a cluster-scoped ClusterNodeMonitoring for the manual
  # experiment cluster. It is applied by scripts/provision-stand-alone-cluster.sh, not by this Kustomization,
  # so it does not land on the GitOps apps-dev cluster.
  # Experiment-variant workloads (bully-*, victim-api, victim-load) are deployed ad-hoc, not via
  # GitOps -- you pick one noisy-neighbour scenario per run and tear it down after.
  # ballast is a fixed precondition (always reserves the exclusive core), not a
  # variant, so it's managed here like the other always-on DaemonSets.
