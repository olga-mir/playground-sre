# Continuous HTTP load against victim-api (hashicorp/http-echo on :5678).
# http-echo does no work until a request arrives, so this is what makes the
# victim runnable and able to be starved by bully-hog.
#
# Pinned to the default node pool. test-pool is the experiment node
# (workload=noisy-node); this pod must not land there. The default pool is an
# e2-medium with ~940m allocatable, and GKE system pods already request ~931m,
# so the CPU request has to stay under the leftover few millicores. The limit
# is what lets fortio actually run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-load
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victim-load
  template:
    metadata:
      labels:
        app: victim-load
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
      - name: fortio
        image: fortio/fortio:latest
        # -qps 0 = as fast as possible, -t 0 = until the pod is deleted.
        # 32 connections is enough to keep a 1-core-capped http-echo busy.
        args:
        - load
        - -qps
        - "0"
        - -c
        - "32"
        - -t
        - "0"
        - -allow-initial-errors
        - http://victim-api.default.svc:5678/
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
