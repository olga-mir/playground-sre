# Continuous HTTP load against victim-api (perf-lab on :5678).
# Hits /v1/scenarios/upstream (sequential, calling the sleep endpoint) as a 10-hop sequential chain of 2ms sleeps at a fixed 100 qps (8 connections).
# Each hop is a separate wake-up, so run-queue waits from bully-hog add up across
# the request instead of hitting a single hop. The victim stays well under its
# CPU limit (no CFS throttling).
#
# Pinned to the default node pool. test-pool is the experiment node
# (workload=noisy-node); this pod must not land there. The default pool is an
# e2-medium with ~940m allocatable, and GKE system pods already request ~931m,
# so the CPU request has to stay under the leftover few millicores. The limit
# is what lets fortio actually run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-load
  namespace: noisy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victim-load
  template:
    metadata:
      labels:
        app: victim-load
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
      - name: fortio
        image: fortio/fortio:latest
        # Fixed 100 qps over 8 connections, -t 0 = until the pod is deleted.
        args:
        - load
        - -qps
        - "100"
        - -c
        - "8"
        - -t
        - "0"
        - -allow-initial-errors
        - http://victim-api.noisy-test.svc:5678/v1/scenarios/upstream?n=10&sequential=true&target=http://localhost:8080/v1/scenarios/sleep?duration=2ms
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
