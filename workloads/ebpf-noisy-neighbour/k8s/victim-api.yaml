# Victim API: perf-lab with latency instrumentation.
#
# Replaced hashicorp/http-echo with perf-lab to capture HTTP request latency
# metrics alongside CPU and PSI metrics during noisy-neighbour experiments.
# The /v1/scenarios/sleep endpoint provides predictable latency behavior.
apiVersion: v1
kind: ConfigMap
metadata:
  name: victim-api-config
  namespace: noisy-test
data:
  ENABLE_CLOUDPROFILER: "false"
  LOG_LEVEL: ""
  DISABLE_RATE_LIMIT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-api
  namespace: noisy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victim-api
  template:
    metadata:
      labels:
        app: victim-api
    spec:
      nodeSelector:
        workload: noisy-node
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "noisy-node"
        effect: "NoSchedule"
      containers:
      - name: api
        image: index.docker.io/olmigar/perf-lab:main
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: victim-api-config
        resources:
          requests:
            cpu: "185m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 1
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: victim-api
  namespace: noisy-test
spec:
  selector:
    app: victim-api
  ports:
  - port: 5678
    targetPort: 8080
    name: http
