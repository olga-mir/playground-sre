name: Build and Push experiment-ebpf

on:
  push:
    branches: ["main"]
    paths:
      - "workloads/ebpf-noisy-neighbour/**"
      - "!workloads/ebpf-noisy-neighbour/k8s/**" # ImageUpdateAutomation writes here — don't rebuild on tag bumps

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image tag
        id: tag
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA=$(git rev-parse --short HEAD)
          echo "tag=main-${TS}-${SHA}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./workloads/ebpf-noisy-neighbour
          push: true
          platforms: linux/amd64
          tags: olmigar/experiment-ebpf:${{ steps.tag.outputs.tag }}
