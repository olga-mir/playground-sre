name: Build and Push perf-lab

on:
  push:
    branches: ["main"]
    paths: ["workloads/perf-lab/**"]

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA=$(git rev-parse --short HEAD)
          echo "tag=main-${TS}-${SHA}" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PUSH_SA }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: australia-southeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./workloads/perf-lab
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: australia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/perf-lab/perf-lab:${{ steps.tag.outputs.tag }}
